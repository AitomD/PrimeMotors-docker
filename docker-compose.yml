version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    environment:
      - MYSQL_ROOT_PASSWORD=Root_password123
      - MYSQL_DATABASE=primemotors_db
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - internal

  backend:
    build:
      context: ../backend
    container_name: backend
    depends_on:
      - db
    environment:
      - DATABASE_URL=mysql://root:Root_password123@db:3306/primemotors_db
    networks:
      - internal
    env_file:
      - ../backend/.env

  frontend:
    build:
      context: ../frontend
    container_name: frontend
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    volumes:
      - ./certs:/etc/nginx/ssl:ro
    networks:
      - internal

volumes:
  mysql_data:

networks:
  internal:
    driver: bridge
