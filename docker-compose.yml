services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    environment:
      - MYSQL_ROOT_PASSWORD=Root_password123
      - MYSQL_DATABASE=primemotors_db
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pRoot_password123"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ../PrimeMotors-backend
    container_name: backend
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ../PrimeMotors-backend/.env
    networks:
      - internal
    ports:
      - "3000:3000"
    command: npm run start

    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:3000/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s

  frontend:
    build:
      context: ../PrimeMotors-FrontEnd
    container_name: frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/ssl:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal

  playwright:
    image: mcr.microsoft.com/playwright:v1.47.0-jammy
    container_name: playwright
    working_dir: /tests
    volumes:
      - ../PrimeMotors-e2e:/tests
    networks:
      - internal
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    command: npx playwright test

volumes:
  mysql_data:

networks:
  internal:
    driver: bridge